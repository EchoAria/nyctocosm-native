plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '0.3.0-native-alpha.8'
group = 'com.flubberschnub.nyctocosm'
base { archivesName = 'nyctocosm-native' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { nyctocosm { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('smoke')) {
                property 'nyctocosm.clientSmoke', 'true'
                args '--quickPlaySingleplayer', 'NativeSmoke'
            }
        }
        server { args '--nogui' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'nyctocosm' }
        data {
            workingDirectory project.file('run-data')
            args '--mod', 'nyctocosm', '--all', '--output', file('src/generated/resources'), '--existing', file('src/main/resources')
        }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.13' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar).configure {
    exclude '**/NativeGameTests*', '**/ClientSmoke*', 'data/nyctocosm/structures/empty.nbt', 'data/nyctocosm/structures/portal_test.nbt'
    finalizedBy 'reobfJar'
}
